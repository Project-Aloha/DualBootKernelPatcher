name: Build patcher for multiple platforms

on:
  push:
    branches: [main, feature/multi-boot]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
            cmake_arch: x64
            vcpkg_triplet: x64-windows-static
            build_shim_loader: 'OFF'
            executable_suffix: .exe
            executable_directory: Release
          - name: Windows ARM64
            os: windows-11-arm
            arch: arm64
            cmake_arch: ARM64
            vcpkg_triplet: arm64-windows-static
            build_shim_loader: 'OFF'
            executable_suffix: .exe
            executable_directory: Release
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            c_compiler: clang
            build_shim_loader: 'ON'
            executable_suffix: ''
            executable_directory: .
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
            c_compiler: clang
            build_shim_loader: 'OFF'
            executable_suffix: ''
            executable_directory: .
          - name: macOS x64
            os: macos-15-intel
            arch: x64
            c_compiler: clang
            build_shim_loader: 'OFF'
            executable_suffix: ''
            executable_directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libinih-dev pkg-config

      - name: Install ShimLoader toolchain
        if: matrix.build_shim_loader == 'ON'
        run: sudo apt-get install --yes binutils-aarch64-linux-gnu

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install inih pkg-config

      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DBUILD_SHIM_LOADER=${{ matrix.build_shim_loader }}

      - name: Configure CMake on Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHIM_LOADER=${{ matrix.build_shim_loader }}

      - name: Build host tools
        run: >-
          cmake --build "${{ github.workspace }}/build"
          --config Release
          --target MultiBootKernelPatcher HDRTool

      - name: Build ShimLoader
        if: matrix.build_shim_loader == 'ON'
        run: >-
          cmake --build "${{ github.workspace }}/build"
          --config Release
          --target ShimLoader_BIN Shims

      - name: Stage host tools
        shell: bash
        run: |
          mkdir -p artifacts/tools
          cp "build/${{ matrix.executable_directory }}/MultiBootKernelPatcher${{ matrix.executable_suffix }}" artifacts/tools/
          cp "build/${{ matrix.executable_directory }}/HDRTool${{ matrix.executable_suffix }}" artifacts/tools/

      - name: Upload host tools
        uses: actions/upload-artifact@v4
        with:
          name: Tools-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/tools
          if-no-files-found: error

      - name: Upload ShimLoader
        if: matrix.build_shim_loader == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: ShimLoader
          path: build/ShimLoader/ShimLoader.bin
          if-no-files-found: error

      - name: Upload simplified Shims
        if: matrix.build_shim_loader == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: Shims
          path: build/Shims/Shim.*.bin
          if-no-files-found: error

      - name: Upload configs
        if: matrix.build_shim_loader == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: Configs
          path: Config
          if-no-files-found: error
