[Pack]
# Paths are resolved relative to this configuration file.
Shim=/path/to/shim.bin
Output=../build/ShimImage

# Default references an Image section. Timeout=0 waits indefinitely.
Default=Image-A
Timeout=5000

[Image-A]
Name=Android Linux
Path=/path/to/base-Image
Type=Linux
BaseImage=true
Align=0x200000

[Image-B]
Name=Recovery Linux
Path=/path/to/recovery-Image
Type=Linux
BaseImage=false
Align=0x200000

# Images with CopyTo are copied to that address and booted from it.
# [Image-UEFI]
# Name=UEFI
# Path=../../firmware/UEFI.fd
# Type=FreeExec
# BaseImage=false
# CopyTo=0x9FC00000
# CopySizeMax=0x00300000
# EntryOffset=0
# Align defaults to 4 for UEFI-style executable payloads.

[Manifest]
Type=Manifest