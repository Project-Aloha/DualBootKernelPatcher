[Pack]
Shim=../build/Shims/Shim.AYAPS.bin
Output=../build/PatchedKernel
Default=Image
Timeout=0

[Image]
Name=Android/Linux
Path=/path/to/Image
Type=Linux
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=/path/to/SM8550_EFI.fd
Type=FreeExec
BaseImage=false
CopyTo=0xC7CC0000
CopySizeMax=0x00400000
EntryOffset=0

[Manifest]
Type=Manifest