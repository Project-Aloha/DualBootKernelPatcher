[Pack]
Shim=../build/Shims/Shim.AYAPS.bin
Output=../build/PatchedKernel
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image
Timeout=0

[Image]
Name=Android/Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=/path/to/SM8550_EFI.fd
BaseImage=false
CopyTo=0xC7CC0000
CopySizeMax=0x00400000