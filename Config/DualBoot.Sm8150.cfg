[Pack]
Shim=../build/Shims/Shim.Hotdog.bin
Output=../build/PatchedKernel.Sm8150
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image-A
Timeout=0

[Image-A]
Name=OnePlus 7T Pro Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=../../firmware/SM8150_EFI.fd
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000