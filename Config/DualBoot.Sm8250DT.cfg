[Pack]
Shim=../build/Shims/Shim.KernelWrapper.bin
Output=../build/PatchedKernel.Sm8250DT
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image-A
Timeout=0

[Image-A]
Name=SM8250 Mainline Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-DTB]
Name=Mainline Device Tree
Path=../../firmware/mainline.dtb
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000
Align=8