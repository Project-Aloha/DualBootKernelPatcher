[Pack]
Shim=../build/Shims/Shim.Pipa.bin
Output=../build/PatchedKernel.Sm8250
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image-A
Timeout=0

[Image-A]
Name=Xiaomi Pad 6 Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=../../firmware/SM8250_EFI.fd
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000
