[Pack]
Shim=../build/Shims/Shim.AYAPS.bin
Output=../build/PatchedKernel.Sm8550
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image-A
Timeout=0

[Image-A]
Name=AYANEO Pocket S Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=../../firmware/SM8550_EFI.fd
BaseImage=false
CopyTo=0xC7CC0000
CopySizeMax=0x00400000