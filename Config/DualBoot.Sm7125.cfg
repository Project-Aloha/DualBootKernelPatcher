[Pack]
Shim=../build/Shims/Shim.Miatoll.bin
Output=../build/PatchedKernel.Sm7125
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image-A
Timeout=0

[Image-A]
Name=Redmi Note 9S Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=../../firmware/SM7125_EFI.fd
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000