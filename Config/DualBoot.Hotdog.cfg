[Pack]
Shim=../build/Shims/Shim.Hotdog.bin
Output=../build/PatchedKernel
Loader=../build/ShimLoader/ShimLoader.bin
Default=Image
Timeout=0

[Image]
Name=Android/Linux
Path=/path/to/Image
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=/path/to/SM8150_EFI.fd
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000