[Pack]
Shim=../build/Shims/Shim.KernelWrapper.bin
Output=../build/PatchedKernel
Default=Image
Timeout=0

[Image]
Name=Linux
Path=/path/to/Image
Type=Linux
BaseImage=true
Align=0x200000

[Image-DTB]
Name=Mainline Device Tree
Path=/path/to/mainline.dtb
Type=DTB
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000
Align=8

[Manifest]
Type=Manifest