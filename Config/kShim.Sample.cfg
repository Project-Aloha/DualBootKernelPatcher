[Pack]
# Paths are resolved relative to this configuration file.
Shim=/path/to/kshim.bin
Output=../build/PatchedKernel

# Default references an Image section. Timeout=0 waits indefinitely.
Default=Image-A
Timeout=5000

[Image-A]
Name=Android Kernel
Path=/path/to/base-Image
Type=Linux
BaseImage=true
Align=0x200000

[Image-B]
Name=Linux Kernel
Path=/path/to/linux-Image
Type=Linux
BaseImage=false
Align=0x200000
DeviceTreeBlob=Image-DTB

[Image-DTB]
Name=Linux Device Tree
Path=/path/to/linux.dtb
Type=DTB
BaseImage=false

[Image-UEFI]
Name=UEFI
Path=/path/to/UEFI.fd
Type=FreeExec
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000
EntryOffset=0
# Align defaults to 4 for UEFI-style executable payloads.

# ... other images or blobs

[Manifest]
Type=Manifest