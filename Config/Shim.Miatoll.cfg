[Pack]
Shim=../build/Shims/Shim.Miatoll.bin
Output=../build/PatchedKernel
Default=Image
Timeout=0

[Image]
Name=Android/Linux
Path=/path/to/Image
Type=Linux
BaseImage=true
Align=0x200000

[Image-UEFI]
Name=UEFI
Path=/path/to/SM7125_EFI.fd
Type=FreeExec
BaseImage=false
CopyTo=0x9FC00000
CopySizeMax=0x00300000
EntryOffset=0

[Manifest]
Type=Manifest